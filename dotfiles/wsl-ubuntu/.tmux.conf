set -g mouse on
set -g status-right "%H:%M"

# 中央にペイン一覧を表示（アクティブなペインは背景色付き）
set -g status-justify centre
set -g window-status-format ''
set -g window-status-separator ''
set -g window-status-current-format "#(tmux list-panes -t '#{session_name}:#{window_index}' -F '##{?pane_active,#[bg=colour22 fg=colour15 bold] ##{pane_index}##{?pane_title, ##{pane_title},} #[default], ##{pane_index} }' 2>/dev/null | tr -d '\n')"

# ペイン切り替え時に即時リフレッシュ
set-hook -g pane-focus-in 'refresh-client -S'
